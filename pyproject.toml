[project]
name = "data-room-search"
version = "0.1.0"
description = "Tool de recherche dans une data room de contrats, appelé par un agent LLM"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dataroom-mcp = "dataroom.mcp_server:main"   # commande sans argument, pour les clients MCP (Claude Desktop…)

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dataroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [  # dépréciations internes au TestClient ; filtres sans import de classe, robustes aux versions
    "ignore:Using `httpx`",
    "ignore::DeprecationWarning:starlette.testclient",
]
